# Studio harness config. One file per game repo. Env vars like ${VAR} are expanded.
game:
  name: MyGame
  unity_project: game                 # Unity project folder, relative to repo root
  build_target: StandaloneWindows64   # StandaloneWindows64 | StandaloneLinux64 | StandaloneOSX
  player_binary: Builds/Player/MyGame.exe   # relative to unity_project, produced by the build gate

unity:
  editor_path: ""                     # empty = found via the Unity CLI (`unity editors path <project version>`); set only to override
  build_timeout_min: 40
  test_timeout_min: 20
  autotest_timeout_min: 10
  screen: {width: 1280, height: 720}

runner:
  # MONEY IS OPTIONAL. 0 = run only on your Claude plan's included quota (ANTHROPIC_API_KEY is stripped
  # from agent calls so Claude Code uses your subscription login). >0 = also allow real API spend for
  # `paid: true` cards, models not in plan_models, and one escalation attempt after a plan-quota failure.
  money_budget_usd: 0
  api_key_env: ANTHROPIC_API_KEY
  plan_models: [haiku, sonnet, opus]   # what your plan includes (trim if your plan lacks a model)
  # $0 SAFETY: stripping ANTHROPIC_API_KEY is not enough if your account has extra usage / overage turned on —
  # then hitting the plan limit silently bills money instead of stopping. Check your Claude account's usage
  # settings, turn extra usage off, then set this to true. The runner refuses to start a $0 run until you do.
  plan_overage_disabled: false
  force_model: ""                      # e.g. haiku — overrides every model choice (selftest uses this)
  escalation: {enabled: true, model: opus, budget_usd: 3.0}   # only ever used when money_budget_usd > 0
  main_branch: main
  worktrees_dir: .worktrees            # gitignored; one worktree per card
  max_cards_per_run: 12
  stop_after_consecutive_failures: 3
  seed_library_cache: true             # copy main's Unity Library/ into the worktree (skipped while the editor has it open)
  # The ONLY paths an unattended agent may change. Everything else (harness package, Packages/manifest.json,
  # scenarios, workflows, scripts, steam/...) needs the card's `allow_paths`.
  agent_writable: [game/Assets/, game/ProjectSettings/TagManager.asset, game/ProjectSettings/InputManager.asset]
  # Inside agent_writable, these still need `allow_paths` (Editor code runs with your rights during the build gate).
  agent_writable_except: ["/Editor/", ".asmdef", ".asmref", ".rsp", ".dll", ".so", ".dylib", ".bundle/", ".jslib"]
  # C# patterns that can tamper with the gates or reach outside the game. A diff containing any of them is NOT
  # executed (no build, no tests): the card goes to backlog/review for you to read first.
  suspicious_cs: ['InitializeOnLoad', 'DidReloadScripts', 'System\.Diagnostics\.Process', 'Process\.Start',
                  'GetCommandLineArgs', 'harnessOut', '-autotest', 'metrics\.json', '\bHarness\.', '"Harness',
                  'System\.Net\b', 'UnityWebRequest', 'Environment\.GetEnvironmentVariable', 'DllImport',
                  'Assembly\.Load', 'File\.(Delete|Move)', 'Directory\.(Delete|Move)', 'ScriptingDefineSymbols',
                  'VERDICT']
  sandbox:
    # Gates run code the agent wrote (Editor scripts, tests, the player). Real isolation = run them as another
    # OS user or in a container with no access to your home, credentials or the main checkout, e.g.
    #   prefix: [sudo, -u, hxsandbox, --]          (Linux/macOS; give that user read/write on .worktrees only)
    #   prefix: [firejail, --private-tmp, --blacklist=~/.ssh, --blacklist=~/.claude, --]
    # Empty = no OS isolation (env scrub + suspicious-code review + integrity checks still apply).
    prefix: []
    scrub_env: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_BASE_URL, MAGNIFIC_API_KEY, TRIPO_API_KEY,
                GITHUB_TOKEN, GH_TOKEN, STEAM_BUILD_USER, SSH_AUTH_SOCK, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
                AWS_SESSION_TOKEN, AWS_BEARER_TOKEN_BEDROCK, GOOGLE_APPLICATION_CREDENTIALS]
  defaults:
    model: sonnet                      # sonnet is the workhorse; opus only for cards tagged hard
    budget_usd: 3.0                    # per-card cap (Claude's estimate). On plan quota: stops one card eating your quota
    timeout_min: 45
    max_turns: 80
    gates: [build, release, editmode, playmode, autotest, review]   # release = build without HARNESS + scan
  models:                              # card `difficulty` -> model alias
    trivial: haiku
    normal: sonnet
    hard: opus
  review:                              # independent diff review gate (the diff is untrusted input)
    model: sonnet                      # haiku is too easy to fool for code that merges unattended
    budget_usd: 0.80
    max_turns: 12

art:
  # $0 by default. Switch a stage to a paid provider per project or per asset (manifest `providers:`).
  providers:
    concept: manual      # manual ($0: any free tool / sketch) | comfyui ($0, local GPU) | magnific (paid)
    model: manual        # manual ($0: drop a GLB) | comfyui ($0, local Hunyuan3D/TripoSR workflow) | tripo (paid)
    texture: manual      # manual ($0: CC0 libraries) | magnific (paid)
  comfyui:
    url: http://127.0.0.1:8188
    concept_workflow: art/workflows/concept.api.json   # export from ComfyUI with "Save (API format)"
    model_workflow: art/workflows/image_to_3d.api.json
  magnific:
    base_url: https://api.magnific.com
    generate_endpoint: /v1/ai/mystic                    # text-to-image; check docs.magnific.com for your plan
    upscale_endpoint: /v1/ai/image-upscaler-precision-v2
    api_key_env: MAGNIFIC_API_KEY
    est_usd_per_image: 0.05            # your plan's real price; used for the ledger only
    est_usd_per_upscale: 0.10
  tripo:
    base_url: https://openapi.tripo3d.ai/v3
    api_key_env: TRIPO_API_KEY
    face_limit: 8000
    est_usd_per_model: 0.40
    texture: true
    pbr: true
  blender:
    path: blender                      # PATH, then /Applications/Blender.app and Program Files are searched
  import_dir: Assets/Art/Models       # inside the Unity project

marketing:
  capture: {width: 1080, height: 1920, fps: 30}      # vertical for shorts
  out_dir: marketing/out
  schedule: marketing/schedule.yaml

steam:
  app_id: ""
  depot_id: ""
  branch: beta                         # never auto-set live; promote by hand in Steamworks
